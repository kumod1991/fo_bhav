
name: Futures bhavcopy -> Supabase

on:
  schedule:
    - cron: "30 13 * * 1-5"

  workflow_dispatch:
    inputs:
      start:
        description: "Start date YYYY-MM-DD (blank = today)"
        required: false
        type: string
      end:
        description: "End date YYYY-MM-DD (blank = same as start)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run loader
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          START_DATE: ${{ inputs.start }}
          END_DATE: ${{ inputs.end }}
        run: |
          if [ -n "$START_DATE" ]; then
            if [ -n "$END_DATE" ]; then
              python fetch_fut_bhav.py "$START_DATE" "$END_DATE"
            else
              python fetch_fut_bhav.py "$START_DATE"
            fi
          else
            python fetch_fut_bhav.py
          fi
